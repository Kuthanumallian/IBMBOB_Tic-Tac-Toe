<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe 5×5</title>
  <style>
    /* ─── CSS Custom Properties ─────────────────────────────────── */
    :root {
      --bg:          #f0f4f8;
      --surface:     #ffffff;
      --border:      #cbd5e1;
      --text:        #1e293b;
      --muted:       #64748b;
      --x-color:     #ef4444;
      --o-color:     #3b82f6;
      --win-bg:      #fef9c3;
      --btn-bg:      #3b82f6;
      --btn-hover:   #2563eb;
      --btn-danger:  #ef4444;
      --btn-danger-hover: #dc2626;
      --cell-hover:  #e2e8f0;
      --shadow:      0 4px 24px rgba(0,0,0,.08);
      --radius:      14px;
      --transition:  .18s ease;
    }
    [data-theme="dark"] {
      --bg:          #0f172a;
      --surface:     #1e293b;
      --border:      #334155;
      --text:        #f1f5f9;
      --muted:       #94a3b8;
      --x-color:     #f87171;
      --o-color:     #60a5fa;
      --win-bg:      #422006;
      --btn-bg:      #3b82f6;
      --btn-hover:   #2563eb;
      --btn-danger:  #ef4444;
      --btn-danger-hover: #dc2626;
      --cell-hover:  #334155;
      --shadow:      0 4px 24px rgba(0,0,0,.4);
    }

    /* ─── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 12px 48px;
      transition: background var(--transition), color var(--transition);
    }

    /* ─── Header ────────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header h1 span { font-size: .85rem; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      width: 38px; height: 38px;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), border-color var(--transition);
    }
    .icon-btn:hover { background: var(--cell-hover); }

    /* ─── Card ──────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 20px 20px;
      width: 100%;
      max-width: 540px;
    }

    /* ─── Player Names ──────────────────────────────────────────── */
    .player-names {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .name-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .name-group label {
      font-size: .72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .name-group.x label { color: var(--x-color); }
    .name-group.o label { color: var(--o-color); }
    .name-group input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .88rem;
      padding: 6px 10px;
      outline: none;
      transition: border-color var(--transition);
      width: 100%;
    }
    .name-group input:focus { border-color: var(--btn-bg); }

    /* ─── Options Row ───────────────────────────────────────────── */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .options-row label { font-size: .82rem; color: var(--muted); }
    select {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .82rem;
      padding: 5px 9px;
      outline: none;
      cursor: pointer;
    }

    /* ─── Toggle Switch ─────────────────────────────────────────── */
    .toggle-wrap { display: flex; align-items: center; gap: 7px; }
    .toggle {
      position: relative; width: 38px; height: 21px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 21px;
      cursor: pointer;
      transition: background .2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 15px; height: 15px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--btn-bg); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(17px); }

    /* ─── Status Bar ────────────────────────────────────────────── */
    .status-bar {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      min-height: 30px;
      margin-bottom: 14px;
      padding: 5px 0;
      border-radius: 8px;
      transition: background .3s, color .3s;
    }
    .status-bar.x-turn  { color: var(--x-color); }
    .status-bar.o-turn  { color: var(--o-color); }
    .status-bar.result  { background: var(--win-bg); font-size: 1.08rem; }

    /* ─── Board ─────────────────────────────────────────────────── */
    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-bottom: 18px;
    }
    .cell {
      aspect-ratio: 1;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 6vw, 2.1rem);
      font-weight: 900;
      transition: background var(--transition), transform .1s, border-color var(--transition);
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .cell:hover:not(.taken):not(.game-over) {
      background: var(--cell-hover);
      border-color: var(--btn-bg);
    }
    .cell.taken { cursor: not-allowed; }
    .cell.x { color: var(--x-color); }
    .cell.o { color: var(--o-color); }
    .cell.winning {
      background: var(--win-bg);
      border-color: #facc15;
      animation: pulse 0.6s ease infinite alternate;
    }
    /* AI thinking shimmer */
    .cell.thinking {
      animation: shimmer 0.8s ease infinite alternate;
    }
    @keyframes shimmer {
      from { background: var(--bg); }
      to   { background: var(--cell-hover); }
    }
    @keyframes popIn {
      0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
      70%  { transform: scale(1.15) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .cell.pop { animation: popIn .22s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }

    /* ─── AI thinking indicator ─────────────────────────────────── */
    .ai-thinking {
      text-align: center;
      font-size: .78rem;
      color: var(--o-color);
      font-weight: 600;
      min-height: 18px;
      margin-bottom: 6px;
      letter-spacing: .04em;
    }

    /* ─── Score Bar ─────────────────────────────────────────────── */
    .score-bar {
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin-bottom: 14px;
    }
    .score-item {
      flex: 1;
      text-align: center;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
    }
    .score-item .score-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .score-item.x .score-label { color: var(--x-color); }
    .score-item.o .score-label { color: var(--o-color); }
    .score-item .score-val { font-size: 1.4rem; font-weight: 800; }
    .score-item.x .score-val { color: var(--x-color); }
    .score-item.o .score-val { color: var(--o-color); }

    /* ─── Buttons ───────────────────────────────────────────────── */
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--btn-bg); color: #fff; }
    .btn-primary:hover { background: var(--btn-hover); }
    .btn-danger  { background: var(--btn-danger); color: #fff; }
    .btn-danger:hover  { background: var(--btn-danger-hover); }

    /* ─── Current-player indicators ─────────────────────────────── */
    .turn-indicator {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 10px;
    }
    .indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: .80rem; font-weight: 600;
      opacity: .32; transition: opacity .3s;
    }
    .indicator.active { opacity: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .indicator.x .dot { background: var(--x-color); }
    .indicator.o .dot { background: var(--o-color); }

    /* ─── Win-condition note ─────────────────────────────────────── */
    .win-note {
      text-align: center;
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ─── Responsive ────────────────────────────────────────────── */
    @media (max-width: 420px) {
      .card { padding: 14px 10px 14px; }
      .player-names { flex-direction: column; }
      .board { gap: 5px; }
    }
  </style>
</head>
<body>

<!-- ─── Header ─────────────────────────────────────────────────── -->
<header>
  <h1>Tic‑Tac‑Toe <span>5×5</span></h1>
  <div class="header-actions">
    <button class="icon-btn" id="muteBtn"  title="Toggle sound"  aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme"  aria-label="Toggle theme">🌙</button>
  </div>
</header>

<!-- ─── Main Card ──────────────────────────────────────────────── -->
<div class="card">

  <!-- Player name inputs -->
  <div class="player-names">
    <div class="name-group x">
      <label for="nameX">Player X</label>
      <input type="text" id="nameX" maxlength="16" placeholder="Player X" value="Player X" />
    </div>
    <div class="name-group o">
      <label for="nameO">Player O</label>
      <input type="text" id="nameO" maxlength="16" placeholder="Player O" value="Player O" />
    </div>
  </div>

  <!-- Options row -->
  <div class="options-row">
    <div style="display:flex;align-items:center;gap:8px;">
      <label for="firstPlayer">Starts:</label>
      <select id="firstPlayer">
        <option value="X">X</option>
        <option value="O">O</option>
      </select>
    </div>

    <div class="toggle-wrap">
      <label for="aiToggle">AI Opponent</label>
      <label class="toggle">
        <input type="checkbox" id="aiToggle" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="diffWrap" style="display:none;align-items:center;gap:8px;" class="toggle-wrap">
      <label for="difficulty">Level:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard" selected>Hard</option>
      </select>
    </div>
  </div>

  <!-- Turn indicators -->
  <div class="turn-indicator">
    <div class="indicator x active" id="indX">
      <div class="dot"></div>
      <span id="indNameX">Player X</span>
    </div>
    <div class="indicator o" id="indO">
      <div class="dot"></div>
      <span id="indNameO">Player O</span>
    </div>
  </div>

  <!-- Status message -->
  <div class="status-bar x-turn" id="status" role="status" aria-live="polite">
    Player X's turn
  </div>

  <!-- Win condition hint -->
  <div class="win-note">Get <strong>4 in a row</strong> to win</div>

  <!-- AI thinking indicator -->
  <div class="ai-thinking" id="aiThinking"></div>

  <!-- 5×5 Board -->
  <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe 5x5 board">
    <!-- cells injected by JS -->
  </div>

  <!-- Score bar -->
  <div class="score-bar">
    <div class="score-item x">
      <div class="score-label" id="scoreXLabel">Player X</div>
      <div class="score-val"   id="scoreX">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Draws</div>
      <div class="score-val"   id="scoreD">0</div>
    </div>
    <div class="score-item o">
      <div class="score-label" id="scoreOLabel">Player O</div>
      <div class="score-val"   id="scoreO">0</div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" id="resetBtn">New Game</button>
    <button class="btn btn-danger"  id="resetScoresBtn">Reset Scores</button>
  </div>

</div><!-- /.card -->

<script>
/* ═══════════════════════════════════════════════════════════════
   Tic-Tac-Toe 5×5 — 4-in-a-row wins — Heuristic AI
   ═══════════════════════════════════════════════════════════════ */

const BOARD_SIZE = 5;       // 5×5
const WIN_LENGTH = 4;       // need 4 in a row
const CELLS      = BOARD_SIZE * BOARD_SIZE; // 25

/* ─── Generate all winning lines (rows, cols, diagonals ≥4) ─── */
const WIN_LINES = (() => {
  const lines = [];
  // rows
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c <= BOARD_SIZE - WIN_LENGTH; c++) {
      lines.push(Array.from({length: WIN_LENGTH}, (_, k) => r * BOARD_SIZE + c + k));
    }
  }
  // cols
  for (let c = 0; c < BOARD_SIZE; c++) {
    for (let r = 0; r <= BOARD_SIZE - WIN_LENGTH; r++) {
      lines.push(Array.from({length: WIN_LENGTH}, (_, k) => (r + k) * BOARD_SIZE + c));
    }
  }
  // diagonals (top-left to bottom-right)
  for (let r = 0; r <= BOARD_SIZE - WIN_LENGTH; r++) {
    for (let c = 0; c <= BOARD_SIZE - WIN_LENGTH; c++) {
      lines.push(Array.from({length: WIN_LENGTH}, (_, k) => (r + k) * BOARD_SIZE + (c + k)));
    }
  }
  // diagonals (top-right to bottom-left)
  for (let r = 0; r <= BOARD_SIZE - WIN_LENGTH; r++) {
    for (let c = WIN_LENGTH - 1; c < BOARD_SIZE; c++) {
      lines.push(Array.from({length: WIN_LENGTH}, (_, k) => (r + k) * BOARD_SIZE + (c - k)));
    }
  }
  return lines;
})();

/* ─── Cell-line index: which lines pass through each cell ──── */
const CELL_LINES = Array.from({length: CELLS}, () => []);
WIN_LINES.forEach((line, li) => line.forEach(ci => CELL_LINES[ci].push(li)));

/* ─── State ──────────────────────────────────────────────────── */
let board        = Array(CELLS).fill(null);
let currentTurn  = 'X';
let gameOver     = false;
let scores       = { X: 0, O: 0, D: 0 };
let muted        = false;
let aiEnabled    = false;
let aiDifficulty = 'hard';
const AI_MARK    = 'O';

/* ─── DOM refs ───────────────────────────────────────────────── */
const boardEl        = document.getElementById('board');
const statusEl       = document.getElementById('status');
const aiThinkingEl   = document.getElementById('aiThinking');
const scoreXEl       = document.getElementById('scoreX');
const scoreOEl       = document.getElementById('scoreO');
const scoreDEl       = document.getElementById('scoreD');
const scoreXLabel    = document.getElementById('scoreXLabel');
const scoreOLabel    = document.getElementById('scoreOLabel');
const resetBtn       = document.getElementById('resetBtn');
const resetScoresBtn = document.getElementById('resetScoresBtn');
const nameXInput     = document.getElementById('nameX');
const nameOInput     = document.getElementById('nameO');
const firstPlayerSel = document.getElementById('firstPlayer');
const aiToggle       = document.getElementById('aiToggle');
const diffWrap       = document.getElementById('diffWrap');
const difficultySel  = document.getElementById('difficulty');
const muteBtn        = document.getElementById('muteBtn');
const themeBtn       = document.getElementById('themeBtn');
const indX           = document.getElementById('indX');
const indO           = document.getElementById('indO');
const indNameX       = document.getElementById('indNameX');
const indNameO       = document.getElementById('indNameO');

/* ─── Audio ──────────────────────────────────────────────────── */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq = 440, dur = 0.1, type = 'sine') {
  if (muted) return;
  try {
    const ctx  = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playPlace() { beep(520, 0.08, 'sine'); }
function playWin()   {
  beep(523, 0.12, 'sine');
  setTimeout(() => beep(659, 0.12, 'sine'), 120);
  setTimeout(() => beep(784, 0.18, 'sine'), 240);
}
function playDraw()  { beep(300, 0.3, 'triangle'); }

/* ─── localStorage ───────────────────────────────────────────── */
const LS_SCORES = 'ttt5_scores';
const LS_THEME  = 'ttt5_theme';
const LS_MUTED  = 'ttt5_muted';
const LS_NAMES  = 'ttt5_names';

function saveScores() { localStorage.setItem(LS_SCORES, JSON.stringify(scores)); }
function loadScores() {
  try { const s = JSON.parse(localStorage.getItem(LS_SCORES)); if (s && typeof s.X === 'number') scores = s; } catch(e) {}
}
function saveNames()  { localStorage.setItem(LS_NAMES, JSON.stringify({ X: nameXInput.value, O: nameOInput.value })); }
function loadNames()  {
  try { const n = JSON.parse(localStorage.getItem(LS_NAMES)); if (n) { if (n.X) nameXInput.value = n.X; if (n.O) nameOInput.value = n.O; } } catch(e) {}
}
function loadTheme()  {
  const t = localStorage.getItem(LS_THEME) || 'light';
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
}
function loadMuted()  {
  muted = localStorage.getItem(LS_MUTED) === '1';
  muteBtn.textContent = muted ? '🔇' : '🔊';
}

/* ─── Helpers ────────────────────────────────────────────────── */
function name(mark) {
  return mark === 'X' ? (nameXInput.value.trim() || 'Player X') : (nameOInput.value.trim() || 'Player O');
}
function emptyIndices(b) { return b.map((v,i) => v === null ? i : -1).filter(i => i !== -1); }

/* ─── Build Board DOM ────────────────────────────────────────── */
function buildBoard() {
  boardEl.innerHTML = '';
  for (let i = 0; i < CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('aria-label', `Cell ${i + 1}`);
    cell.dataset.index = i;
    cell.addEventListener('click', onCellClick);
    boardEl.appendChild(cell);
  }
}

/* ─── Render Board State ─────────────────────────────────────── */
function renderBoard(animateIndex = -1) {
  const cells = boardEl.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    cell.textContent = board[i] || '';
    cell.className   = 'cell' + (board[i] ? ` taken ${board[i].toLowerCase()}` : '');
    if (gameOver) cell.classList.add('game-over');
    if (i === animateIndex) {
      cell.classList.remove('pop');
      void cell.offsetWidth;
      cell.classList.add('pop');
    }
  });
}

/* ─── Highlight Winning Cells ────────────────────────────────── */
function highlightWin(line) {
  const cells = boardEl.querySelectorAll('.cell');
  line.forEach(i => cells[i].classList.add('winning'));
}

/* ─── UI Updates ─────────────────────────────────────────────── */
function updateStatus(msg, cls = '') {
  statusEl.textContent = msg;
  statusEl.className   = `status-bar ${cls}`;
}
function updateIndicators() {
  indX.classList.toggle('active', currentTurn === 'X');
  indO.classList.toggle('active', currentTurn === 'O');
  indNameX.textContent = name('X');
  indNameO.textContent = name('O');
}
function renderScores() {
  scoreXEl.textContent    = scores.X;
  scoreOEl.textContent    = scores.O;
  scoreDEl.textContent    = scores.D;
  scoreXLabel.textContent = name('X');
  scoreOLabel.textContent = name('O');
}
function setAiThinking(on) {
  aiThinkingEl.textContent = on ? '🤖 AI is thinking…' : '';
}

/* ─── Check Win ──────────────────────────────────────────────── */
function checkWin(b, mark) {
  return WIN_LINES.find(line => line.every(i => b[i] === mark)) || null;
}
function checkDraw(b) { return b.every(v => v !== null); }

/* ─── Cell Click ─────────────────────────────────────────────── */
function onCellClick(e) {
  const idx = +e.currentTarget.dataset.index;
  if (gameOver || board[idx]) return;
  if (aiEnabled && currentTurn === AI_MARK) return;
  makeMove(idx);
}

/* ─── Make Move ──────────────────────────────────────────────── */
function makeMove(idx) {
  if (gameOver || board[idx]) return;
  board[idx] = currentTurn;
  playPlace();
  renderBoard(idx);

  const winLine = checkWin(board, currentTurn);
  if (winLine) {
    gameOver = true;
    highlightWin(winLine);
    scores[currentTurn]++;
    saveScores(); renderScores();
    playWin();
    updateStatus(`🎉 ${name(currentTurn)} wins!`, 'result');
    updateIndicators();
    setAiThinking(false);
    return;
  }
  if (checkDraw(board)) {
    gameOver = true;
    scores.D++;
    saveScores(); renderScores();
    playDraw();
    updateStatus(`🤝 It's a draw!`, 'result');
    updateIndicators();
    setAiThinking(false);
    return;
  }

  currentTurn = currentTurn === 'X' ? 'O' : 'X';
  updateStatus(`${name(currentTurn)}'s turn`, currentTurn === 'X' ? 'x-turn' : 'o-turn');
  updateIndicators();

  if (aiEnabled && currentTurn === AI_MARK && !gameOver) {
    setAiThinking(true);
    setTimeout(aiMove, 320);
  }
}

/* ═══════════════════════════════════════════════════════════════
   AI — Heuristic Threat-Based Engine
   Strategy:
     Hard   → deep threat scoring + look-ahead (2-ply minimax on top candidates)
     Medium → threat scoring, occasional mistakes
     Easy   → mostly random with basic block
   ═══════════════════════════════════════════════════════════════ */

function aiMove() {
  if (gameOver) return;
  const idx = getAiMove();
  setAiThinking(false);
  if (idx !== -1) makeMove(idx);
}

function getAiMove() {
  switch (aiDifficulty) {
    case 'easy':   return easyMove();
    case 'medium': return mediumMove();
    case 'hard':   return hardMove();
    default:       return hardMove();
  }
}

/* ── Easy: random, but block immediate wins 60% of the time ──── */
function easyMove() {
  const human = AI_MARK === 'O' ? 'X' : 'O';
  if (Math.random() < 0.60) {
    for (const i of emptyIndices(board)) {
      const test = [...board]; test[i] = human;
      if (checkWin(test, human)) return i;
    }
  }
  const empties = emptyIndices(board);
  return empties[Math.floor(Math.random() * empties.length)] ?? -1;
}

/* ── Medium: always win/block, heuristic 65% rest ─────────────── */
function mediumMove() {
  const human = AI_MARK === 'O' ? 'X' : 'O';
  for (const i of emptyIndices(board)) {
    const t = [...board]; t[i] = AI_MARK; if (checkWin(t, AI_MARK)) return i;
  }
  for (const i of emptyIndices(board)) {
    const t = [...board]; t[i] = human;   if (checkWin(t, human))   return i;
  }
  if (Math.random() < 0.65) return scoredMove(board, AI_MARK);
  const empties = emptyIndices(board);
  return empties[Math.floor(Math.random() * empties.length)] ?? -1;
}

/* ── Hard: full heuristic + 2-ply minimax on top candidates ───── */
function hardMove() {
  const human = AI_MARK === 'O' ? 'X' : 'O';

  // 1. Immediate win
  for (const i of emptyIndices(board)) {
    const t = [...board]; t[i] = AI_MARK; if (checkWin(t, AI_MARK)) return i;
  }
  // 2. Block immediate human win
  for (const i of emptyIndices(board)) {
    const t = [...board]; t[i] = human; if (checkWin(t, human)) return i;
  }
  // 3. Detect & play double-threat fork (own)
  const fork = findFork(board, AI_MARK);
  if (fork !== -1) return fork;
  // 4. Block human fork
  const humanFork = findFork(board, human);
  if (humanFork !== -1) return humanFork;
  // 5. 2-ply minimax on the top-8 heuristic-scored candidates
  return twoPlyBest(board, AI_MARK);
}

/* ─── Heuristic: score each empty cell ───────────────────────── */
/**
 * For each WIN_LINE passing through a cell, count how many of our marks
 * and opponent marks are there. A line blocked by opponent is worthless.
 * Score weights: 3-in-line >> 2-in-line >> 1-in-line >> center/corner bonus.
 */
const LINE_SCORE = { own: [0, 1, 10, 100, 100000], opp: [0, 1, 8, 80, 100000] };

function evalCell(b, idx, mark) {
  const opp = mark === 'X' ? 'O' : 'X';
  let score = 0;
  for (const li of CELL_LINES[idx]) {
    const line = WIN_LINES[li];
    let ownCount = 0, oppCount = 0;
    for (const ci of line) {
      if (b[ci] === mark) ownCount++;
      else if (b[ci] === opp) oppCount++;
    }
    if (oppCount === 0) score += LINE_SCORE.own[ownCount];
    if (ownCount === 0) score += LINE_SCORE.opp[oppCount] * 0.9; // slight discount for defensive value
  }
  // Center + near-center positional bonus
  const r = Math.floor(idx / BOARD_SIZE), c = idx % BOARD_SIZE;
  const centrality = (2 - Math.abs(r - 2)) + (2 - Math.abs(c - 2)); // 0–4
  score += centrality * 2;
  return score;
}

function scoredMove(b, mark) {
  let best = -Infinity, bestIdx = -1;
  for (const i of emptyIndices(b)) {
    const s = evalCell(b, i, mark);
    if (s > best) { best = s; bestIdx = i; }
  }
  return bestIdx;
}

/* ─── Fork detection: find a move that creates 2+ open 3-in-lines */
function findFork(b, mark) {
  const opp = mark === 'X' ? 'O' : 'X';
  for (const i of emptyIndices(b)) {
    const test = [...b]; test[i] = mark;
    // Count lines that now have 3-of-mark and are not blocked
    let threats = 0;
    for (const li of CELL_LINES[i]) {
      const line = WIN_LINES[li];
      let cnt = 0, blocked = false;
      for (const ci of line) {
        if (test[ci] === mark) cnt++;
        else if (test[ci] === opp) { blocked = true; break; }
      }
      if (!blocked && cnt >= 3) threats++;
    }
    if (threats >= 2) return i;
  }
  return -1;
}

/* ─── 2-ply minimax on top N heuristic candidates ─────────────── */
function twoPlyBest(b, mark) {
  const opp = mark === 'X' ? 'O' : 'X';
  const empties = emptyIndices(b);

  // Score and sort all empties, take top 8
  const scored = empties
    .map(i => ({ i, s: evalCell(b, i, mark) }))
    .sort((a, z) => z.s - a.s)
    .slice(0, 8);

  let best = -Infinity, bestIdx = scored[0]?.i ?? -1;

  for (const { i } of scored) {
    const b1 = [...b]; b1[i] = mark;
    // Opponent's best reply (1-ply look-ahead)
    let oppBest = -Infinity;
    const oppEmpties = emptyIndices(b1).slice(0, 8); // limit for speed
    for (const j of oppEmpties) {
      const s = evalCell(b1, j, opp);
      if (s > oppBest) oppBest = s;
    }
    // Our score = own heuristic − opponent's best reply value
    const netScore = evalCell(b, i, mark) - oppBest * 0.8;
    if (netScore > best) { best = netScore; bestIdx = i; }
  }
  return bestIdx;
}

/* ─── New Game ───────────────────────────────────────────────── */
function newGame() {
  board       = Array(CELLS).fill(null);
  gameOver    = false;
  currentTurn = firstPlayerSel.value;
  setAiThinking(false);
  renderBoard();
  updateStatus(`${name(currentTurn)}'s turn`, currentTurn === 'X' ? 'x-turn' : 'o-turn');
  updateIndicators();
  renderScores();
  if (aiEnabled && currentTurn === AI_MARK) {
    setAiThinking(true);
    setTimeout(aiMove, 500);
  }
}

/* ─── Reset Scores ───────────────────────────────────────────── */
function resetScores() {
  scores = { X: 0, O: 0, D: 0 };
  saveScores(); renderScores();
  newGame();
}

/* ─── Starts dropdown ────────────────────────────────────────── */
function updateStartsDropdown() {
  firstPlayerSel.options[0].textContent = name('X');
  firstPlayerSel.options[1].textContent = name('O');
}

/* ─── Event Listeners ────────────────────────────────────────── */
resetBtn.addEventListener('click', newGame);
resetScoresBtn.addEventListener('click', () => { if (confirm('Reset all scores?')) resetScores(); });

themeBtn.addEventListener('click', () => {
  const cur  = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem(LS_THEME, next);
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  localStorage.setItem(LS_MUTED, muted ? '1' : '0');
});

aiToggle.addEventListener('change', () => {
  aiEnabled = aiToggle.checked;
  diffWrap.style.display = aiEnabled ? 'flex' : 'none';
  nameOInput.disabled    = aiEnabled;
  if (aiEnabled) {
    nameOInput.value = 'AI';
  } else {
    nameOInput.value = 'Player O';
    loadNames();
  }
  updateStartsDropdown();
  renderScores();
  newGame();
});

difficultySel.addEventListener('change', () => { aiDifficulty = difficultySel.value; newGame(); });

let nameDebounce;
[nameXInput, nameOInput].forEach(inp => {
  inp.addEventListener('input', () => {
    clearTimeout(nameDebounce);
    nameDebounce = setTimeout(() => {
      saveNames(); renderScores(); updateIndicators(); updateStartsDropdown();
      updateStatus(`${name(currentTurn)}'s turn`, currentTurn === 'X' ? 'x-turn' : 'o-turn');
    }, 300);
  });
});

firstPlayerSel.addEventListener('change', newGame);

/* ─── Init ───────────────────────────────────────────────────── */
(function init() {
  loadTheme(); loadMuted(); loadScores(); loadNames();
  updateStartsDropdown();
  buildBoard();
  newGame();
})();
</script>
